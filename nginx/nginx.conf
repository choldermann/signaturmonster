events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    # Docker's embedded DNS — re-resolve hostnames every 10s so nginx picks up
    # new container IPs after restarts without needing its own restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name _;

        # Update-Status/Start direkt zum Updater (überlebt Backend-/Nginx-Neustart)
        location = /api/update/status {
            set $updater_host updater:9000;
            proxy_pass         http://$updater_host/update/status;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }
        location = /api/update/run {
            set $updater_host updater:9000;
            proxy_pass         http://$updater_host/update/start;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 30s;
        }

        # API → Backend
        location /api/ {
            set $backend_host backend:8000;
            proxy_pass         http://$backend_host;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }

        # Health check
        location /health {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;
        }

        # API Docs
        location /docs {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;
        }
        location /openapi.json {
            set $backend_host backend:8000;
            proxy_pass http://$backend_host;
        }

        # Frontend → React App
        location / {
            set $frontend_host frontend:80;
            proxy_pass         http://$frontend_host;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
